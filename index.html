<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d9488">
  <title>Мой вес и замеры</title>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-light: #ccfbf1;
      --accent: #f59e0b;
      --violet: #7c3aed;
      --violet-light: #ede9fe;
      --card: #ffffff;
      --text: #134e4a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px 12px 44px;
      background: linear-gradient(180deg, #e6fffa 0%, #f8fafc 40%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .title-wrap p {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--muted);
    }

    .backup-btns {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      background: #fff;
      border: 1px solid var(--border);
      color: #334155;
      padding: 7px 9px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-mini:active {
      background: #f1f5f9;
    }

    /* Главные вкладки */
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .main-tab {
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .main-tab.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .tab-pane {
      display: none;
    }

    .tab-pane.active {
      display: block;
    }

    /* Карточки */
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.85);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }

    .edit-goal-btn {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Блок цели */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid #f1f5f9;
    }

    .stat-box.highlight {
      background: #f0fdfa;
      border-color: #99f6e4;
    }

    .stat-box.violet-hl {
      background: #f5f3ff;
      border-color: #ddd6fe;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }

    .stat-box.highlight .stat-val {
      color: var(--primary-dark);
    }

    .stat-box.violet-hl .stat-val {
      color: var(--violet);
    }

    .progress-wrap {
      margin-top: 6px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #14b8a6, #0d9488);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Настройка цели */
    .goal-form {
      display: none;
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    .goal-form.open {
      display: block;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Форма ввода */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px 11px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 15px;
      color: #0f172a;
      background: #fff;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.99);
    }

    .btn-violet {
      background: var(--violet);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }

    /* Переключатели периода на графике */
    .period-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 10px;
      gap: 3px;
    }

    .period-tab {
      border: none;
      background: transparent;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }

    .period-tab.active {
      background: #fff;
      color: var(--primary-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .chart-box {
      width: 100%;
      height: 215px;
      position: relative;
      margin-top: 8px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

      display: flex
